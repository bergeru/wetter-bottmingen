<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulrich Berger · Wetter in Bottmingen</title>
  <meta name="description" content="Persönliche Website von Ulrich Berger mit dem Wetter in Bottmingen für heute und die nächsten drei Tage.">
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --ink: #1f2a33;
      --muted: #6b7680;
      --accent: #c8102e;
      --line: #e3ded3;
      --warm: #e07a2f;
      --cold: #2f6fb0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181c;
        --card: #1d2329;
        --ink: #eef1f3;
        --muted: #9aa5ae;
        --line: #2c343c;
        --warm: #f0a060;
        --cold: #78aee6;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 64px; }

    nav { display: flex; gap: 6px; margin-bottom: 32px; }
    nav a {
      color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; font-size: 15px;
    }
    nav a:hover { color: var(--ink); background: var(--card); }
    nav a[aria-current="page"] { color: var(--ink); background: var(--card); border: 1px solid var(--line); }

    header { margin-bottom: 40px; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    }
    .flag {
      width: 16px; height: 16px; background: var(--accent); border-radius: 3px; position: relative;
    }
    .flag::before, .flag::after {
      content: ""; position: absolute; background: #fff; left: 50%; top: 50%; transform: translate(-50%, -50%);
    }
    .flag::before { width: 10px; height: 3px; }
    .flag::after { width: 3px; height: 10px; }
    h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.1; margin: 10px 0 8px; letter-spacing: -0.02em; }
    .lead { color: var(--muted); font-size: 18px; margin: 0; }

    .now {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      padding: 28px; display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center;
    }
    .now-icon { font-size: 84px; line-height: 1; }
    .now-temp { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .now-desc { font-size: 20px; margin-top: 6px; }
    .now-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; color: var(--muted); font-size: 15px; }
    .now-meta b { color: var(--ink); font-weight: 600; }

    h2 { font-size: 20px; margin: 40px 0 16px; }
    .days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .day {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px 16px; text-align: center;
    }
    .day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .day-name { font-weight: 600; }
    .day-date { color: var(--muted); font-size: 14px; }
    .day-icon { font-size: 44px; margin: 10px 0 4px; }
    .day-desc { font-size: 14px; color: var(--muted); min-height: 42px; }
    .day-temps { font-size: 20px; margin-top: 6px; }
    .max { color: var(--warm); font-weight: 700; }
    .min { color: var(--cold); }
    .day-extra { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 2px; }

    .status { color: var(--muted); padding: 28px; text-align: center; }
    .error { color: var(--accent); }

    footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
    footer a { color: inherit; }

    @media (max-width: 720px) {
      .days { grid-template-columns: repeat(2, 1fr); }
      .now { grid-template-columns: 1fr; text-align: center; }
      .now-meta { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav aria-label="Hauptnavigation">
      <a href="./" aria-current="page">Wetter</a>
      <a href="kurs.html">Bank WIR</a>
    </nav>

    <header>
      <div class="eyebrow"><span class="flag" aria-hidden="true"></span> Bottmingen · Basel-Landschaft</div>
      <h1>Hallo, ich bin Ulrich.</h1>
      <p class="lead">Willkommen auf meiner Website. Hier siehst du, wie das Wetter bei mir in Bottmingen ist.</p>
    </header>

    <section aria-labelledby="now-title">
      <h2 id="now-title" style="margin-top:0">Jetzt gerade</h2>
      <div id="now" class="now"><div class="status">Wetterdaten werden geladen …</div></div>
    </section>

    <section aria-labelledby="days-title">
      <h2 id="days-title">Heute und die nächsten drei Tage</h2>
      <div id="days" class="days"></div>
    </section>

    <footer>
      <p id="updated"></p>
      <p>Wetterdaten: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)</p>
    </footer>
  </div>

  <script>
    // Bottmingen BL, Schweiz
    const LAT = 47.5228;
    const LON = 7.5711;

    const API = "https://api.open-meteo.com/v1/forecast"
      + `?latitude=${LAT}&longitude=${LON}`
      + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset"
      + "&timezone=Europe%2FZurich&forecast_days=4";

    // WMO-Wettercodes → Beschreibung und Symbol
    const WEATHER = {
      0:  ["Klar", "☀️", "🌙"],
      1:  ["Überwiegend klar", "🌤️", "🌙"],
      2:  ["Teilweise bewölkt", "⛅", "☁️"],
      3:  ["Bedeckt", "☁️", "☁️"],
      45: ["Nebel", "🌫️", "🌫️"],
      48: ["Raureifnebel", "🌫️", "🌫️"],
      51: ["Leichter Nieselregen", "🌦️", "🌧️"],
      53: ["Nieselregen", "🌦️", "🌧️"],
      55: ["Starker Nieselregen", "🌧️", "🌧️"],
      56: ["Gefrierender Niesel", "🌧️", "🌧️"],
      57: ["Starker gefrierender Niesel", "🌧️", "🌧️"],
      61: ["Leichter Regen", "🌦️", "🌧️"],
      63: ["Regen", "🌧️", "🌧️"],
      65: ["Starker Regen", "🌧️", "🌧️"],
      66: ["Gefrierender Regen", "🌧️", "🌧️"],
      67: ["Starker gefrierender Regen", "🌧️", "🌧️"],
      71: ["Leichter Schneefall", "🌨️", "🌨️"],
      73: ["Schneefall", "🌨️", "🌨️"],
      75: ["Starker Schneefall", "❄️", "❄️"],
      77: ["Schneegriesel", "🌨️", "🌨️"],
      80: ["Leichte Regenschauer", "🌦️", "🌧️"],
      81: ["Regenschauer", "🌧️", "🌧️"],
      82: ["Heftige Regenschauer", "⛈️", "⛈️"],
      85: ["Leichte Schneeschauer", "🌨️", "🌨️"],
      86: ["Schneeschauer", "❄️", "❄️"],
      95: ["Gewitter", "⛈️", "⛈️"],
      96: ["Gewitter mit Hagel", "⛈️", "⛈️"],
      99: ["Schweres Gewitter mit Hagel", "⛈️", "⛈️"]
    };
    const describe = (code, isDay = 1) => {
      const w = WEATHER[code] || ["Unbekannt", "🌡️", "🌡️"];
      return { text: w[0], icon: isDay ? w[1] : w[2] };
    };

    const round = n => Math.round(n);
    const fmtDay = new Intl.DateTimeFormat("de-CH", { weekday: "long" });
    const fmtDate = new Intl.DateTimeFormat("de-CH", { day: "numeric", month: "long" });
    const fmtTime = new Intl.DateTimeFormat("de-CH", { hour: "2-digit", minute: "2-digit" });
    // "2026-11-16" als lokales Datum lesen (nicht als UTC)
    const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

    function renderNow(c) {
      const w = describe(c.weather_code, c.is_day);
      document.getElementById("now").innerHTML = `
        <div class="now-icon" aria-hidden="true">${w.icon}</div>
        <div>
          <div class="now-temp">${round(c.temperature_2m)}°C</div>
          <div class="now-desc">${w.text}</div>
          <div class="now-meta">
            <span>Gefühlt <b>${round(c.apparent_temperature)}°</b></span>
            <span>Luftfeuchtigkeit <b>${round(c.relative_humidity_2m)} %</b></span>
            <span>Wind <b>${round(c.wind_speed_10m)} km/h</b></span>
          </div>
        </div>`;
    }

    function renderDays(d) {
      const html = d.time.map((date, i) => {
        const w = describe(d.weather_code[i]);
        const day = parseDate(date);
        const name = i === 0 ? "Heute" : i === 1 ? "Morgen" : fmtDay.format(day);
        const rainProb = d.precipitation_probability_max?.[i];
        return `
          <article class="day${i === 0 ? " today" : ""}">
            <div class="day-name">${name}</div>
            <div class="day-date">${fmtDate.format(day)}</div>
            <div class="day-icon" aria-hidden="true">${w.icon}</div>
            <div class="day-desc">${w.text}</div>
            <div class="day-temps"><span class="max">${round(d.temperature_2m_max[i])}°</span> / <span class="min">${round(d.temperature_2m_min[i])}°</span></div>
            <div class="day-extra">
              <span>💧 ${rainProb != null ? rainProb + " %" : "–"} · ${d.precipitation_sum[i].toFixed(1)} mm</span>
              <span>💨 bis ${round(d.wind_speed_10m_max[i])} km/h</span>
              <span>🌅 ${fmtTime.format(new Date(d.sunrise[i]))} · 🌇 ${fmtTime.format(new Date(d.sunset[i]))}</span>
            </div>
          </article>`;
      }).join("");
      document.getElementById("days").innerHTML = html;
    }

    async function load() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        renderNow(data.current);
        renderDays(data.daily);
        document.getElementById("updated").textContent =
          "Zuletzt aktualisiert: " + new Intl.DateTimeFormat("de-CH", { dateStyle: "full", timeStyle: "short" }).format(new Date());
      } catch (err) {
        document.getElementById("now").innerHTML =
          `<div class="status error">Die Wetterdaten konnten nicht geladen werden. Bitte später nochmals versuchen.</div>`;
        console.error(err);
      }
    }

    load();
    setInterval(load, 30 * 60 * 1000); // alle 30 Minuten aktualisieren
  </script>
</body>
</html>
