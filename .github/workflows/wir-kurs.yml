name: WIR-Kurs aktualisieren

on:
  schedule:
    # Mo–Fr, etwa alle 2 Stunden während des Tages (Zeiten in UTC)
    - cron: "17 7-17/2 * * 1-5"
  workflow_dispatch: # erlaubt manuelles Starten unter "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kursdaten von BEKB OTC-X holen
        run: |
          set -euo pipefail
          BASE="https://www.otc-x.ch/api/market/securities/CH1204218437"
          FROM=$(date -u -d '1 year ago' +%F)
          UNTIL=$(date -u +%F)
          UA="Mozilla/5.0 (privates Kurs-Widget)"
          curl -fsS -A "$UA" "$BASE" -o /tmp/security.json
          curl -fsS -A "$UA" "$BASE/highLow" -o /tmp/highlow.json
          curl -fsS -A "$UA" "$BASE/chartData?type=PRICE_HISTORY&from=$FROM&until=$UNTIL&interval=WEEK" -o /tmp/chart.json
          mkdir -p data
          jq -n \
            --slurpfile s /tmp/security.json \
            --slurpfile h /tmp/highlow.json \
            --slurpfile c /tmp/chart.json \
            '{security: $s[0], highLow: $h[0], history: [$c[0].data[] | {date: .x, price: .values[0]}]}' \
            > data/wir-bs.json

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898549+github-actions[bot]@users.noreply.github.com"
          git add data/wir-bs.json
          if git diff --cached --quiet; then
            echo "Keine Kursänderung."
          else
            git commit -m "WIR-Kurs aktualisiert"
            git push
          fi
